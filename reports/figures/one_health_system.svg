   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17374f" x="32.148" y="25.128" transform="rotate(-0 32.148 25.128)">AEGIS One Health decision system</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52636f" x="32.148" y="50.436" transform="rotate(-0 32.148 50.436)">Missouri refrigerated-poultry dispatch review | observed evidence, exploratory alignment and simulation remain distinct</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #285b83" x="48.1284" y="113.893305" transform="rotate(-0 48.1284 113.893305)">HUMAN HEALTH</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 140.223375)">PulseNet-derived BEAM aggregates</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 155.192125)">NORS historical outbreak records</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 168.223375)">Separate isolate / outbreak denominators</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #285b83" x="48.1284" y="238.381305" transform="rotate(-0 48.1284 238.381305)">FOOD / ANIMAL</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 264.711375)">FSIS selected poultry primary samples</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 278.711375)">Salmonella Positive / Negative</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 293.680125)">No consumer-illness label</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #285b83" x="48.1284" y="363.553305" transform="rotate(-0 48.1284 363.553305)">ENVIRONMENT</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 389.883375)">NOAA: five Missouri airport stations</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 403.883375)">Daily ambient TMAX / TMIN / PRCP</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 417.883375)">No cargo / establishment exposure</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #285b83" x="346.8924" y="113.893305" transform="rotate(-0 346.8924 113.893305)">RETROSPECTIVE ALIGNMENT</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 140.223375)">Missouri selected sample; 7-day lead</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 154.223375)">Explicit origins and assumed lags</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 168.223375)">Ecological state-level covariates</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 182.223375)">No genomic or causal attribution</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 196.223375)">No validated prospective forecast</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36b17" x="346.8924" y="334.141305" transform="rotate(-0 346.8924 334.141305)">DECISION SUPPORT</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 360.471375)">Inspect / verify; compare plans; substitute</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 374.471375)">Propose precautionary hold for review</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 388.471375)">Model output cannot impose a hold</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(346.8924 402.471375)">Concrete plan requires human approval</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36b17" x="690.8184" y="113.893305" transform="rotate(-0 690.8184 113.893305)">SIMULATED SUPPLY CHAIN</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 140.223375)">Suppliers → DCs → fictional recipients</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 154.223375)">Lots, trucks, stock and cargo telemetry</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 168.223375)">No verified real contracts / traceability</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36b17" x="690.8184" y="276.001305" transform="rotate(-0 690.8184 276.001305)">HUMAN APPROVAL</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 302.331375)">Dispatcher and receiving review</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 316.331375)">Inventory / time / eligibility constraints</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 330.331375)">Held or recalled lots cannot dispatch</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36b17" x="690.8184" y="433.321305" transform="rotate(-0 690.8184 433.321305)">SIMULATED OUTCOMES</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 459.651375)">Delivered kg; unmet demand; cost / delay</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 473.651375)">Quality-window parameter sensitivity</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(690.8184 487.651375)">No measured illnesses prevented</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #76618d" x="48.1284" y="507.193305" transform="rotate(-0 48.1284 507.193305)">FOOD SECURITY / ACCESS — HISTORICAL CONTEXT</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 533.523375)">USDA ERS county indicators (2019 / 2020 / 2023); actual recipient need is unverified.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #21313f" transform="translate(48.1284 547.523375)">No county is assigned to a fictional destination; service trade-offs are simulated.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #285b83" x="487.242" y="277.524" transform="rotate(-0 487.242 277.524)">attention evidence only</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #43525d" x="35.28" y="588.636" transform="rotate(-0 35.28 588.636)">Blue solid: observed-data alignment    ··· Dotted: context / evidence only    — — Orange dashed: simulated decision pathway</text>
  </g>
 </g>

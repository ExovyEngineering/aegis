name: AEGIS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks-and-team-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-notebooks.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-lock.txt
      - name: Install pinned optional notebook tooling
        run: python -m pip install -r requirements-notebooks.txt
      - run: npm --prefix frontend ci
      - name: Execute all reproducible analysis notebooks
        run: python scripts/execute_notebooks.py
      - name: Execute and record all release checks
        run: python scripts/verify_project.py
      - name: Regenerate presentation brief from recorded evidence
        if: always()
        run: python scripts/build_project_brief.py
      - name: Regenerate the complete printable user guide
        if: always()
        run: python scripts/build_master_guide.py
      - name: Regenerate the final five-task handoff
        if: always()
        run: python scripts/build_final_handoff.py
      - name: Preserve team brief and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-team-brief-${{ github.sha }}
          retention-days: 30
          path: |
            reports/aegis_project_brief.pdf
            reports/project_brief.md
            reports/project_brief_manifest.json
            reports/session_verification.json
            reports/checks/
            reports/aegis_master_guide.pdf
            reports/aegis_master_guide.html
            reports/master_guide_manifest.json
            docs/aegis_master_guide.md
            reports/final_submission_guide.pdf
            reports/final_submission_guide.html
            reports/final_submission_guide.md
            reports/final_handoff_manifest.json
            reports/challenge_readiness.json
            reports/notebook_execution.json
            reports/notebooks/
